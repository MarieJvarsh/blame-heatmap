<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Blame Heatmap</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #1c1b19;
      color: #e6edf3;
      padding: 12px;
      min-width: 220px;
      max-width: 260px;
      font-size: 13px;
    }
    h1 { font-size: 0.88rem; margin-bottom: 10px; color: #e8af34; }
    .stat { font-size: 0.8rem; margin-bottom: 5px; color: #9a9997; }
    .stat strong { color: #4f98a3; }
    .inactive { font-size: 0.8rem; color: #9a9997; line-height: 1.5; }
    .scale-wrap { display: flex; align-items: center; gap: 5px; margin-top: 10px; }
    .scale-label { font-size: 0.7rem; color: #5a5957; }
    .scale-bar { flex: 1; height: 5px; border-radius: 999px; background: linear-gradient(to right, #c6d8e4, #e8af34, #dd6974); }
    .footer { margin-top: 11px; padding-top: 8px; border-top: 1px solid rgba(255,255,255,0.07); font-size: 0.72rem; }
    .footer a { color: #4f98a3; text-decoration: none; cursor: pointer; }
    .footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <h1>🔥 Blame Heatmap</h1>
  <div id="info"><span style="color:#5a5957">Loading…</span></div>
  <div class="footer"><a id="open-options">⚙ Options</a></div>
  <script src="popup.js"></script>
</body>
</html>
